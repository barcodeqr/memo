    });

    document.getElementById('modal-btn-discard').addEventListener('click', () => {
        document.getElementById('save-confirm-modal').style.display = 'none';
        activeFormulaInput = null;
        showPage('page-home');
    });

    document.getElementById('modal-btn-cancel').addEventListener('click', () => {
        document.getElementById('save-confirm-modal').style.display = 'none';
    });

    document.getElementById('btn-save').addEventListener('click', () => {
        let titleVal = document.getElementById('memo-title').value.trim() || "無題の表";
        let savedMemos = JSON.parse(localStorage.getItem('hyo_memos') || '{}');
        if (!currentId) currentId = 'memo_' + Date.now();

        let count = 1; let finalTitle = titleVal; let isDuplicate = true;
        while (isDuplicate) {
            isDuplicate = false;
            for (let id in savedMemos) {
                if (id !== currentId && savedMemos[id].title === finalTitle) {
                    count++; finalTitle = `${titleVal.replace(/（\d+）$/, '')}（${count}）`; isDuplicate = true; break;
                }
            }
        }
        titleVal = finalTitle; document.getElementById('memo-title').value = titleVal;

        let sheetData = getSheetState();
        savedMemos[currentId] = { title: titleVal, data: sheetData.data, cols: sheetData.cols, rows: sheetData.rows, updatedAt: Date.now() };
        localStorage.setItem('hyo_memos', JSON.stringify(savedMemos));
        renderMemoList(); alert(`「${titleVal}」をセーブしました！`);
    });

    function renderMemoList() {
        const listContainer = document.getElementById('memo-list');
        const savedMemos = JSON.parse(localStorage.getItem('hyo_memos') || '{}');
        const keys = Object.keys(savedMemos);
        listContainer.innerHTML = '';
        if (keys.length === 0) { listContainer.innerHTML = '<p style="color: #888; text-align: center; margin: 10px 0;">保存された表メモはありません。</p>'; return; }
        
        keys.sort((a, b) => (savedMemos[b].updatedAt || 0) - (savedMemos[a].updatedAt || 0));
        keys.forEach(id => {
            const memo = savedMemos[id];
            const item = document.createElement('div'); item.className = 'memo-item';
            const dateObj = new Date(memo.updatedAt || Date.now());
            const dateStr = `${dateObj.getFullYear()}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')} ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
            
            const infoDiv = document.createElement('div'); infoDiv.className = 'memo-info';
            infoDiv.addEventListener('click', () => loadMemoToEditor(id));
            infoDiv.innerHTML = `<span class="memo-title-text">${memo.title || "無題の表"}</span><span class="memo-date-text">保存日時: ${dateStr}</span>`;
            
            const actionsDiv = document.createElement('div'); actionsDiv.className = 'memo-actions';
            
            const exportSelect = document.createElement('select');
            const defaultOpt = document.createElement('option');
            defaultOpt.value = ""; defaultOpt.textContent = "出力"; defaultOpt.disabled = true; defaultOpt.selected = true;
            exportSelect.appendChild(defaultOpt);

            const optLine = document.createElement('option'); optLine.value = "line"; optLine.textContent = "LINE"; exportSelect.appendChild(optLine);
            const optExcel = document.createElement('option'); optExcel.value = "excel"; optExcel.textContent = "Excel"; exportSelect.appendChild(optExcel);
            const optCsv = document.createElement('option'); optCsv.value = "csv"; optCsv.textContent = "CSV"; exportSelect.appendChild(optCsv);
            const optJson = document.createElement('option'); optJson.value = "json"; optJson.textContent = "JSON"; exportSelect.appendChild(optJson);

            exportSelect.addEventListener('change', () => {
                const val = exportSelect.value;
                if (val === 'line') sendToLine(memo.title, memo.data, memo.cols || COLS);
                else if (val === 'excel') exportExcel(memo.title, memo.data, memo.cols || COLS);
                else if (val === 'csv') exportCSV(memo.title, memo.data, memo.cols || COLS);
                else if (val === 'json') exportJSON(memo.title, memo);
                exportSelect.value = "";
            });

            const btnDel = document.createElement('button'); btnDel.textContent = '削除'; btnDel.className = 'btn-del';
            btnDel.addEventListener('click', () => {
                if (confirm(`「${memo.title}」を削除してもよろしいですか？`)) {
                    delete savedMemos[id]; localStorage.setItem('hyo_memos', JSON.stringify(savedMemos)); renderMemoList();
                }
            });

            actionsDiv.appendChild(exportSelect); actionsDiv.appendChild(btnDel);
            item.appendChild(infoDiv); item.appendChild(actionsDiv); listContainer.appendChild(item);
        });
    }

    function sendToLine(title, sheetData, totalCols) {
        let text = `【${title}】\n`;
        sheetData.forEach(rowObj => {
            let rowValues = [];
            for (let c = 0; c < totalCols; c++) {
                let cell = rowObj[c];
                let val = cell ? (cell.formula ? evaluateFormula(cell.formula) : cell.val) : "";
                if (val !== "") rowValues.push(val);
            }
            if (rowValues.length > 0) text += rowValues.join(" / ") + "\n";
        });
        const lineUrl = `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`;
        window.open(lineUrl, '_blank');
    }

    function exportJSON(title, memoObj) {
        const jsonStr = JSON.stringify(memoObj, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${title}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function loadMemoToEditor(id) {
        const savedMemos = JSON.parse(localStorage.getItem('hyo_memos') || '{}');
        const memo = savedMemos[id]; if (!memo) return;
        currentId = id; activeFormulaInput = null; document.getElementById('memo-title').value = memo.title;
        
        COLS = memo.cols || 15;
        ROWS = memo.rows || 40;
        buildSheetStructure();

        memo.data.forEach((rowObj, r) => {
            if (r >= ROWS) return;
            Object.keys(rowObj).forEach(cStr => {
                const c = parseInt(cStr); if (c >= COLS) return;
                const cellInfo = rowObj[c]; const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                const td = input ? input.closest('td') : null; const inner = td ? td.querySelector('.cell-inner') : null;
                if (input && td && inner) {
                    input.value = cellInfo.val;
                    if (cellInfo.formula) input.dataset.formula = cellInfo.formula; else delete input.dataset.formula;
                    if (cellInfo.format) input.dataset.format = cellInfo.format; else delete input.dataset.format;
                    input.style.fontWeight = cellInfo.bold || 'normal'; input.style.fontSize = cellInfo.fontSize || '0.9rem';
                    input.style.color = cellInfo.color || ''; input.style.textAlign = cellInfo.align || 'left';
                    inner.style.justifyContent = cellInfo.vertAlign || 'center';
                    td.style.backgroundColor = cellInfo.bg || '';
                    td.style.borderTop = cellInfo.borderTop || defaultBorder; td.style.borderBottom = cellInfo.borderBottom || defaultBorder;
                    td.style.borderLeft = cellInfo.borderLeft || defaultBorder; td.style.borderRight = cellInfo.borderRight || defaultBorder;
                }
            });
        });
        recalculateAllFormulas(); showPage('page-editor');
    }

    document.getElementById('btn-import-file').addEventListener('click', () => {
        document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                currentId = null;
                activeFormulaInput = null;
                
                let baseTitle = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('memo-title').value = baseTitle || "インポートした表";

                let maxR = Math.max(40, jsonRows.length);
                let maxC = 15;
                jsonRows.forEach(row => { if (row.length > maxC) maxC = row.length; });
                maxC = Math.min(maxC, 26 * 26);

                ROWS = maxR;
                COLS = maxC;
                buildSheetStructure();

                jsonRows.forEach((row, r) => {
                    if (r >= ROWS) return;
                    row.forEach((val, c) => {
                        if (c >= COLS) return;
                        const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                        if (input) {
                            input.value = val !== undefined && val !== null ? val : "";
                            processCellFormula(input);
                        }
                    });
                });

                recalculateAllFormulas();
                showPage('page-editor');
                saveState();
            } catch (err) {
                alert("ファイルの読み込みに失敗しました。");
                console.error(err);
            }
            e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
    });

    document.getElementById('btn-import-json').addEventListener('click', () => {
        document.getElementById('json-file-input').click();
    });

    document.getElementById('json-file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const memo = JSON.parse(evt.target.result);
                if (!memo.data || !memo.cols || !memo.rows) {
                    throw new Error("無効なJSONフォーマットです。");
                }

                currentId = null;
                activeFormulaInput = null;
                document.getElementById('memo-title').value = memo.title || file.name.replace(/\.[^/.]+$/, "");

                COLS = memo.cols;
                ROWS = memo.rows;
                buildSheetStructure();

                memo.data.forEach((rowObj, r) => {
                    if (r >= ROWS) return;
                    Object.keys(rowObj).forEach(cStr => {
                        const c = parseInt(cStr); if (c >= COLS) return;
                        const cellInfo = rowObj[c]; const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                        const td = input ? input.closest('td') : null; const inner = td ? td.querySelector('.cell-inner') : null;
                        if (input && td && inner) {
                            input.value = cellInfo.val;
                            if (cellInfo.formula) input.dataset.formula = cellInfo.formula; else delete input.dataset.formula;
                            if (cellInfo.format) input.dataset.format = cellInfo.format; else delete input.dataset.format;
                            input.style.fontWeight = cellInfo.bold || 'normal'; input.style.fontSize = cellInfo.fontSize || '0.9rem';
                            input.style.color = cellInfo.color || ''; input.style.textAlign = cellInfo.align || 'left';
                            inner.style.justifyContent = cellInfo.vertAlign || 'center';
                            td.style.backgroundColor = cellInfo.bg || '';
                            td.style.borderTop = cellInfo.borderTop || defaultBorder; td.style.borderBottom = cellInfo.borderBottom || defaultBorder;
                            td.style.borderLeft = cellInfo.borderLeft || defaultBorder; td.style.borderRight = cellInfo.borderRight || defaultBorder;
                        }
                    });
                });

                recalculateAllFormulas();
                showPage('page-editor');
                saveState();
                alert("JSONファイルから表を読み込みました！");
            } catch (err) {
                alert("JSONファイルの読み込みに失敗しました。");
                console.error(err);
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    });

    function exportExcel(title, sheetData, totalCols) {
        let data = [];
        sheetData.forEach(rowObj => {
            let row = [];
            for (let c = 0; c < totalCols; c++) {
                let cell = rowObj[c];
                row.push(cell ? (cell.formula ? evaluateFormula(cell.formula) : cell.val) : "");
            }
            data.push(row);
        });
        const ws = XLSX.utils.aoa_to_sheet(data); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "シート1"); XLSX.writeFile(wb, `${title}.xlsx`);
    }

    function exportCSV(title, sheetData, totalCols) {
        let csvContent = "";
        sheetData.forEach(rowObj => {
            let rowData = [];
            for (let c = 0; c < totalCols; c++) {
                let val = rowObj[c] ? (rowObj[c].formula ? evaluateFormula(rowObj[c].formula) : rowObj[c].val) : "";
                if(typeof val === 'string') val = val.replace(/[¥,]/g, '');
                val = '"' + String(val).replace(/"/g, '""') + '"'; 
                rowData.push(val);
            }
            csvContent += rowData.join(',') + "\r\n";
        });
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = `${title}.csv`; a.click(); URL.revokeObjectURL(url);
    }

    const drawer = document.getElementById('mobile-toolbar-drawer');
    document.getElementById('btn-open-drawer').addEventListener('click', () => { drawer.classList.toggle('open'); });
    document.getElementById('btn-drawer-close').addEventListener('click', () => { drawer.classList.remove('open'); });

    renderMemoList();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(r => console.log('ServiceWorker 登録完了'))
                .catch(e => console.log('ServiceWorker 登録失敗', e));
        });
    }
</script>

</body>
</html>
